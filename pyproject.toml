[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-autoresearch"
version = "0.1.0"
description = "LLM-assisted autonomous quantitative research harness"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]

[project.scripts]
mimir = "runtime.mimir:main"

[tool.setuptools.packages.find]
include = [
    "application*",
    "core*",
    "dashboard*",
    "evaluation*",
    "experiments*",
    "integrations*",
    "memory*",
    "mutation*",
    "orchestration*",
    "research*",
    "runtime*",
    "strategy_import*",
    "strategy_ir*",
]
exclude = ["docs*", "runs*", "scripts*", "state*", "strategies*", "tests*"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.90",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["state", "runs", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["application", "strategy_ir", "mutation", "experiments", "runtime", "core", "evaluation", "memory", "research", "orchestration", "integrations"]
exclude = "(^tests/|^state/|dashboard_backup\\.py$)"
