# Quant MCP shares the stable Moon *.ts.net host, without changing /mcp.
# All routes proxy to the local, separately authenticated Quant OAuth server.
location = /quant/mcp {
    include /etc/nginx/snippets/workmachine-proxy.conf;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8787/mcp/;
}

location ^~ /quant/ {
    include /etc/nginx/snippets/workmachine-proxy.conf;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8787/;
}

location = /.well-known/oauth-protected-resource/quant/mcp {
    include /etc/nginx/snippets/workmachine-proxy.conf;
    proxy_pass http://127.0.0.1:8787/.well-known/oauth-protected-resource/quant/mcp;
}

location = /.well-known/oauth-authorization-server/quant {
    include /etc/nginx/snippets/workmachine-proxy.conf;
    proxy_pass http://127.0.0.1:8787/.well-known/oauth-authorization-server;
}
