[program:quant-mcp]
command=/bin/bash /shared/moon-workspace/AutoResearchFinance_v2-phase3-5-1-inventory/scripts/run_quant_moon_http.sh
directory=/shared/moon-workspace/AutoResearchFinance_v2-phase3-5-1-inventory
priority=30
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Keep the read-only local monitor up after container restart/crash.
# Separate from Quant MCP: no model callback, no orders, no OAuth changes.
[program:quant-academic-monitor]
command=/bin/bash /shared/moon-workspace/AutoResearchFinance_v2-phase3-5-1-inventory/scripts/run_quant_academic_monitor.sh
directory=/shared/moon-workspace/AutoResearchFinance_v2-phase3-5-1-inventory
priority=40
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
