# Compatibility with older ChatGPT-linked /academic URL; HTTPS-only login still required.
# Do not forward tracking query parameters or point Windows to Docker loopback.
# Retain the Windows-published 127.0.0.1:2999/academic entry point.
# Do not force a Tailscale hostname jump on the local machine.
location = /academic { return 308 /academic/; }
location ^~ /academic/ {
    auth_basic "Quant AutoResearch private research dashboard";
    auth_basic_user_file /shared/moon-workspace/AutoResearchFinance_v2-fresh-research-20261021/state/moon-http/fresh-20261021/dashboard-auth/.htpasswd;
    limit_except GET { deny all; }
    include /etc/nginx/snippets/workmachine-proxy.conf;
    proxy_pass http://127.0.0.1:8082/;
    proxy_buffering off;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
# New independent academic session only. Never replace Moon /mcp or Quant /quant/mcp.
location = /quant-research { return 308 /quant-research/; }
location ^~ /quant-research/ {
    auth_basic "Quant AutoResearch private research dashboard";
    auth_basic_user_file /shared/moon-workspace/AutoResearchFinance_v2-fresh-research-20261021/state/moon-http/fresh-20261021/dashboard-auth/.htpasswd;
    limit_except GET { deny all; }
    include /etc/nginx/snippets/workmachine-proxy.conf;
    proxy_pass http://127.0.0.1:8082/;
    proxy_buffering off;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
